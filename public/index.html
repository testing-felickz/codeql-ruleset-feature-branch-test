<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple website served with Express."
    />
    <title>Welcome</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      body {
        align-items: center;
        background: #f5f7fb;
        color: #1e293b;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(30, 41, 59, 0.12);
        max-width: 36rem;
        padding: 3rem;
        text-align: center;
      }

      h1 {
        color: #2563eb;
        margin-top: 0;
      }

      p {
        line-height: 1.6;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from Express</h1>
      <p>This simple HTML website is being served by an Express.js server.</p>
    </main>
  </body>
</html>
